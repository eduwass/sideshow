<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        background: #1f1e1b;
        color: #eceadf;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        zoom: 2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #4caf78;
        margin-top: 8px;
      }
      h1 {
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .tagline {
        font-size: 30px;
        line-height: 1.45;
        font-weight: 400;
        color: #b3b1a4;
        text-align: center;
        max-width: 980px;
      }
      .tagline b {
        color: #eceadf;
        font-weight: 500;
      }
      .term {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 24px;
        color: #eceadf;
        background: #171613;
        border: 1px solid rgba(255, 255, 250, 0.12);
        border-radius: 12px;
        padding: 16px 28px;
      }
      .term .p {
        color: #4caf78;
        margin-right: 14px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="dot"></div>
      <h1>sideshow</h1>
    </div>
    <div class="tagline">
      A live visual surface for terminal coding agents.<br />
      Agents draw <b>HTML diagrams</b> in your browser; you comment back.
    </div>
    <div class="term"><span class="p">$</span>npx sideshow serve --open</div>
  </body>
</html>
